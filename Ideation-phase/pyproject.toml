[project]
name = "rag-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gurpreet-2024", email = "24cs3022@rgipt.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "deepeval>=4.2.8",
    "google-genai>=2.30.1",
    "huggingface-hub>=1.16.1",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.10",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "transformers>=5.17.0",
]

[project.scripts]
rag-eval = "rag_eval:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
package = false
